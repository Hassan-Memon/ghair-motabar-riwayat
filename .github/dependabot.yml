version: 2
updates:
  # Expo SDK packages must move together with `npx expo install --fix`, so
  # Dependabot only proposes updates for the GitHub Actions and the
  # non-Expo tooling; SDK upgrades are their own task (expo-upgrade).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@types/react"
    groups:
      tooling:
        patterns: ["*"]
